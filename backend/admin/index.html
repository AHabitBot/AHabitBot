<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AHabit Admin</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}body{margin:0;background:#121213;color:#eee}main{max-width:1080px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px}h2{font-size:18px}section{background:#202123;border:1px solid #333;border-radius:18px;padding:22px;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#282a2c;padding:18px;border-radius:14px}.card b{display:block;font-size:28px;color:#9de16a;margin-top:8px}label{display:block;margin:14px 0 5px}input{background:#2b2c2e;border:1px solid #555;border-radius:10px;padding:12px;color:white;width:100%;box-sizing:border-box}button{background:#79c34b;border:0;border-radius:10px;padding:12px 20px;color:#15200f;font-weight:700;cursor:pointer}button.secondary{background:#333;color:white}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #383838;text-align:left}small,.muted{color:#aaa}.scroll{overflow:auto}.error{color:#ff9999}#login{max-width:400px;margin:12vh auto}#dashboard{display:none}#chart{width:100%;height:140px}nav{display:flex;gap:10px;align-items:center}#msg{min-height:22px}</style></head><body><main>
<section id="login"><h1>AHabit Admin</h1><p class="muted">Вход для администратора</p><form id="loginForm"><label>Логин</label><input id="loginName" autocomplete="username" required><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required><p id="msg" class="error"></p><button>Войти</button></form></section>
<div id="dashboard"><header><h1>AHabit <span style="color:#9de16a">Admin</span></h1><button id="logout" class="secondary">Выйти</button></header><section><h2>Обзор</h2><div id="cards" class="cards"></div><p class="muted" id="note"></p></section><section><h2>Регистрации за 30 дней</h2><svg id="chart" viewBox="0 0 800 140" preserveAspectRatio="none" aria-label="График регистраций"></svg></section><section><h2>Пользователи</h2><div class="scroll"><table><thead><tr><th>ID</th><th>Никнейм</th><th>Дата регистрации</th><th>Лига</th><th>XP</th><th>Привычки</th></tr></thead><tbody id="users"></tbody></table></div><p><button id="more" class="secondary">Следующие 50</button></p></section></div>
</main><script>
const $=id=>document.getElementById(id);let page=1;
async function api(url,opts={}){const r=await fetch('/admin/api/'+url,{credentials:'same-origin',cache:'no-store',...opts});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||'Ошибка запроса');return r.json()}
function td(tr,value){const cell=document.createElement('td');cell.textContent=value??'—';tr.append(cell)}
async function loadUsers(reset=false){if(reset){page=1;$('users').replaceChildren()}const data=await api('users?page='+page);for(const u of data.items){const tr=document.createElement('tr');[u.id,u.nickname||u.username||'—',new Date(u.registered).toLocaleDateString('ru-RU'),u.league,u.xp,u.habits].forEach(v=>td(tr,v));$('users').append(tr)}$('more').disabled=data.items.length<50;page++}
async function dashboard(){const data=await api('overview');$('login').style.display='none';$('dashboard').style.display='block';$('cards').replaceChildren();for(const [title,key] of [['Пользователей','users'],['Новые за 7 дней','new_users_7d'],['Активные привычки','active_habits'],['Архивные привычки','archived_habits'],['Подтверждённые дни','confirmed_days'],['Приглашения','referrals']]){const c=document.createElement('div');c.className='card';const t=document.createElement('span');t.textContent=title;const v=document.createElement('b');v.textContent=data[key];c.append(t,v);$('cards').append(c)}$('note').textContent=data.note;const points=data.registrations;const svg=$('chart');svg.replaceChildren();if(points.length){const max=Math.max(1,...points.map(p=>p.count));const coords=points.map((p,i)=>`${10+(points.length===1?0:i*780/(points.length-1))},${125-p.count/max*105}`).join(' ');const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',coords);line.setAttribute('stroke','#9de16a');line.setAttribute('stroke-width','3');line.setAttribute('fill','none');svg.append(line)}await loadUsers(true)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='';try{await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('loginName').value,password:$('password').value})});$('password').value='';await dashboard()}catch(err){$('msg').textContent=err.message}});
$('logout').addEventListener('click',async()=>{await api('logout',{method:'POST'});location.reload()});$('more').addEventListener('click',()=>loadUsers().catch(err=>alert(err.message)));dashboard().catch(()=>{});
</script></body></html>
