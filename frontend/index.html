<!DOCTYPE html>
<html lang="ru">


<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <meta
        name="theme-color"
        content="#F8F9FB"
    >

    <title>Your Ambitions</title>

    <!-- Применяем сохранённую тему до загрузки CSS/JS, чтобы не было белой вспышки. -->
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem("ahabit-theme");
                const theme = savedTheme === "dark" ? "dark" : "light";
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            } catch (error) {
                document.documentElement.dataset.theme = "light";
            }
        })();
    </script>


    <!-- =====================================================
    HABITS V2 — ОБЩАЯ ОБОЛОЧКА
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/app.css"
    >

    <link
        rel="stylesheet"
        href="./css/habits/habits.css"
    >


    <!-- =====================================================
    HABITS V2 — ПУСТАЯ ГЛАВНАЯ СТРАНИЦА
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/habits/habitsMainEmpty/habitsMain.css"
    >


    <!-- =====================================================
    HABITS V2 — ДОБАВЛЕНИЕ ПРИВЫЧКИ
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/habits/addHabitPage/addHabit.css"
    >


    <!-- =====================================================
    HABITS V2 — ВЫБОР ИКОНКИ
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/habits/iconPickerPage/iconPicker.css"
    >


    <!-- =====================================================
    HABITS V2 — СПИСОК ПРИВЫЧЕК
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/habits/habitsList/habitsImport.css"
    >


    <!-- =====================================================
    HABITS V2 — ДЕТАЛЬНАЯ СТРАНИЦА ПРИВЫЧКИ
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/habits/viewHabitDetails/habitDetails.css"
    >


    <!-- =====================================================
    V2 — ОБЩИЕ ИКОНКИ
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/common/icons.css"
    >

    <link
        rel="stylesheet"
        href="./css/navigation.css"
    >


    <!-- =====================================================
    LEADERBOARD V2
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/leaderboard/leaderboard.css"
    >


    <!-- =====================================================
    PROFILE V2
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/profile/profileImport.css"
    >

    <!-- Глобальная система Light / Dark. Подключается последней. -->
    <link
        rel="stylesheet"
        href="./css/theme.css"
    >


    <!-- =====================================================
    GOOGLE MATERIAL SYMBOLS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />


    <!-- =====================================================
    TELEGRAM MINI APP API
    ====================================================== -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>


<body>

    <div
        id="app-loader"
        class="app-loader"
        role="status"
        aria-live="polite"
    >
        <img
            class="app-loader__background"
            src="/img/loading/loading_1.PNG"
            alt=""
            aria-hidden="true"
            fetchpriority="high"
            decoding="async"
        />

        <div class="app-loader__progress-wrap">
            <div
                class="app-loader__text"
                data-app-loader-text
            >Загрузка твоего прогресса...</div>

            <div
                class="app-loader__progress"
                aria-label="Прогресс загрузки"
            >
                <div
                    class="app-loader__progress-fill"
                    data-app-loader-fill
                ></div>

                <span
                    class="app-loader__progress-percent"
                    data-app-loader-percent
                >0%</span>
            </div>
        </div>
    </div>

    <!-- =====================================================
    КОРЕНЬ ВСЕГО ПРИЛОЖЕНИЯ V2
    ====================================================== -->

    <div id="app">

        <!-- =================================================
        СТРАНИЦА ПРИВЫЧЕК V2
        ================================================== -->

        <main
            id="habits-v2-page"
            class="page active"
        >
            <div
                id="habits-v2-root"
                class="page-content"
            ></div>
        </main>


        <!-- =================================================
        СТРАНИЦА ЛИДЕРБОРДА V2
        ================================================== -->

        <main
            id="leaderboard-v2-page"
            class="page"
            hidden
        >
            <div
                id="leaderboard-v2-root"
                class="page-content"
            ></div>
        </main>


        <!-- =================================================
        СТРАНИЦА ПРОФИЛЯ V2
        ================================================== -->

        <main
            id="profile-v2-page"
            class="page"
            hidden
        >
            <div
                id="profile-v2-root"
                class="page-content"
            ></div>
        </main>

    </div>


    <!-- =====================================================
    ИНИЦИАЛИЗАЦИЯ TELEGRAM WEB APP
    ====================================================== -->

    <script>
        const telegramWebApp =
            window.Telegram?.WebApp

        if (telegramWebApp) {
            telegramWebApp.ready()
            telegramWebApp.expand()

            window.telegramWebApp =
                telegramWebApp

            window.initData =
                telegramWebApp.initData
        } else {
            console.warn(
                "Telegram WebApp API недоступен. Приложение запущено вне Telegram."
            )

            window.initData = ""
        }
    </script>


<!-- =====================================================
QR CODE STYLING
====================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"
></script>


<!-- =====================================================
ГЛАВНАЯ ТОЧКА ВХОДА JAVASCRIPT V2
====================================================== -->

<script
    type="module"
    src="./js/app.js"
></script>

</body>

</html>
